baseURL = 'https://thenickvendetta.github.io/'
publishDir = 'docs'
languageCode = 'en-us'
title = 'Nick | My Portfolio'
theme = 'PaperMod'
# Tambah baris ni untuk troubleshoot
sectionPagesMenu = 'main'

[params]
    env = 'production'
    title = 'Nick @ Infosec'
    description = 'Pentest Write-ups & Network Auditing Lab'
    defaultTheme = 'dark' # Terus set stealth/dark mode default
    disableThemeToggle = true # Lock terus tak bagi tukar light mode

    # Letak profile short intro
    [params.profileMode]
        enabled = true
        title = "Hi, I'm Nick"
        subtitle = "Final Year Computer Networking Student & IT Intern. Focusing on Offensive Security & Penetration Testing."
        imageUrl = "https://github.com/thenickvendetta.png" # Guna gambar profile github kau
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/thenickvendetta"
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/username-kau"
        
[[menu.main]]
    name = "Portfolio"
    url = "/posts/"
    weight = 10

[[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20

[[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 30